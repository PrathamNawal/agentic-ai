services:
  - type: web
    name: a2ui-stock-agent
    runtime: python
    plan: free
    rootDir: a2ui-stock-agent
    buildCommand: pip install -r requirements.txt && cd web && npm ci && npm run build
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NODE_VERSION
        value: 22.14.0
