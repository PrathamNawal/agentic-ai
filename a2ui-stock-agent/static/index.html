<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2UI Stock Agent</title>
<style>
  :root { --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --card:#1a1d24; --up:#34c759; --down:#ff5d5d; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; display:flex; flex-direction:column; height:100vh; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:640px; width:100%; margin:0 auto; }
  .msg { margin:10px 0; } .user { text-align:right; color:var(--accent); }
  .card { background:var(--card); border-radius:12px; padding:16px 20px; margin:10px 0; display:inline-block; min-width:220px; }
  .col { display:flex; flex-direction:column; gap:4px; }
  .h1 { font-size:2rem; font-weight:700; } .h2 { font-size:1.1rem; font-weight:600; }
  .caption { color:var(--muted); font-size:.85rem; } .up { color:var(--up); } .down { color:var(--down); }
  form { display:flex; gap:8px; padding:12px 16px; max-width:640px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px; border-radius:8px; border:1px solid #333; background:var(--card); color:var(--fg); font-size:1rem; }
  button { padding:12px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; }
</style>
</head>
<body>
<div id="log"></div>
<form id="f"><input id="q" placeholder="e.g. What's NVDA trading at?" autocomplete="off" required><button>Send</button></form>
<script>
// Minimal A2UI-style renderer: only the components registered here can be drawn.
const surfaces = {};  // surfaceId -> { components: {id: comp}, data: {} }

function resolve(v, data) {
  return v && typeof v === "object" && "path" in v ? data[v.path.replace(/^\//, "")] : v;
}
function render(id, comp, s) {
  const c = s.components[id]; if (!c) return document.createTextNode("");
  const text = (t, cls) => { const e = document.createElement("div"); e.className = cls; e.textContent = t; return e; };
  switch (c.component) {
    case "Card":   { const e = document.createElement("div"); e.className = "card"; e.append(render(c.child, null, s)); return e; }
    case "Column": { const e = document.createElement("div"); e.className = "col"; c.children.forEach(k => e.append(render(k, null, s))); return e; }
    case "Text":   return text(resolve(c.text, s.data), c.variant || "");
    default:       return text("[unsupported component: " + c.component + "]", "caption");
  }
}
function apply(messages, mount) {
  for (const m of messages) {
    if (m.createSurface) surfaces[m.createSurface.surfaceId] = { components: {}, data: {} };
    else if (m.updateComponents) { const s = surfaces[m.updateComponents.surfaceId]; m.updateComponents.components.forEach(c => s.components[c.id] = c); }
    else if (m.updateDataModel) { const s = surfaces[m.updateDataModel.surfaceId]; Object.assign(s.data, m.updateDataModel.value); mount(s); }
  }
}

const log = document.getElementById("log");
const add = (cls, t) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = t; log.append(d); log.scrollTop = log.scrollHeight; return d; };
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById("q"); const message = q.value; q.value = "";
  add("user", message); const wait = add("", "…");
  try {
    const r = await fetch("/chat", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({message}) });
    const j = await r.json(); wait.remove();
    apply(j.a2ui, s => { const d = document.createElement("div"); d.className = "msg"; d.append(render("root", null, s)); log.append(d); });
    if (j.text) add("", j.text);
  } catch (err) { wait.textContent = "Error: " + err; }
};
</script>
</body>
</html>
